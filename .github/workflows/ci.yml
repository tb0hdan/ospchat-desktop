name: CI

# Push/PR verification on a single Linux runner: publish ospchat-shared to
# mavenLocal, then build + smoke-test the desktop module. Native installers
# are only built on tag pushes — see `release.yml`.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Assumption: ospchat-shared lives in a sibling GitHub repo under the same
# owner — i.e. github.com/${OWNER}/ospchat-shared. Override via the
# OSPCHAT_SHARED_REPO repo variable if that's wrong.
env:
  OSPCHAT_SHARED_REPO: ${{ vars.OSPCHAT_SHARED_REPO || format('{0}/ospchat-shared', github.repository_owner) }}
  OSPCHAT_SHARED_REF: ${{ vars.OSPCHAT_SHARED_REF || 'main' }}

jobs:
  build:
    name: build + tests (linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ospchat-desktop
        uses: actions/checkout@v4
        with:
          path: ospchat-desktop

      - name: Checkout ospchat-shared
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OSPCHAT_SHARED_REPO }}
          ref: ${{ env.OSPCHAT_SHARED_REF }}
          path: ospchat-shared

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 8.10.2
        # Manual install matches ospchat-android's CI — keeps gradle pinned
        # across both repos.
        run: |
          set -euo pipefail
          curl -sSLo /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.10.2/bin/gradle --version

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ospchat-shared/**/*.gradle*', 'ospchat-shared/**/libs.versions.toml', 'ospchat-desktop/**/*.gradle*', 'ospchat-desktop/**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Android SDK
        # ospchat-shared targets `androidTarget` so it pulls AGP + Android
        # SDK during configuration even when publishing only the JVM variants.
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Publish ospchat-shared to mavenLocal
        working-directory: ospchat-shared
        run: gradle publishToMavenLocal --no-daemon

      - name: Run shared module tests
        working-directory: ospchat-shared
        run: gradle desktopTest --no-daemon

      - name: Compile ospchat-desktop
        working-directory: ospchat-desktop
        run: gradle :compileKotlinDesktop --no-daemon

      - name: Smoke-build distributable
        # Faster than full installer: validates jlink/jpackage runtime image
        # without spending time on the .deb packaging step.
        working-directory: ospchat-desktop
        run: gradle :createDistributable --no-daemon
