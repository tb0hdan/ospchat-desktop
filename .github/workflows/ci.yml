name: CI

# Push/PR verification on a single Linux runner: build + smoke-test the
# desktop module. ospchat-shared is consumed from GitHub Packages — no
# sibling-repo checkout needed. Native installers are only built on tag
# pushes — see `release.yml`.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  # Required so the workflow's GITHUB_TOKEN can pull ospchat-shared from
  # GitHub Packages — even public packages require an authenticated GET.
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + tests (linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ospchat-desktop
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 8.10.2
        # Manual install matches ospchat-android's CI — keeps gradle pinned
        # across both repos.
        run: |
          set -euo pipefail
          curl -sSLo /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.10.2/bin/gradle --version

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compile ospchat-desktop
        # GHP credentials are surfaced as Gradle properties so
        # settings.gradle.kts can authenticate the ospchat-shared registry
        # lookup.
        env:
          ORG_GRADLE_PROJECT_gprUser: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gprToken: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :compileKotlinDesktop --no-daemon

      - name: Smoke-build distributable
        # Faster than full installer: validates jlink/jpackage runtime image
        # without spending time on the .deb packaging step.
        env:
          ORG_GRADLE_PROJECT_gprUser: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gprToken: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :createDistributable --no-daemon
