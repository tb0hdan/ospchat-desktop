name: Release

# On tag push (e.g. `v0.1.0`), matrix-build native installers on Linux,
# macOS, and Windows and attach all three to a GitHub Release named after
# the tag. jpackage only produces installers for its host OS, so the
# matrix is mandatory.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Required so the workflow's GITHUB_TOKEN can pull ospchat-shared from
  # GitHub Packages — even public packages require an authenticated GET.
  packages: read

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_ext: deb
            installer_glob: build/compose/binaries/main/deb/*.deb
          - os: macos-latest
            target_ext: dmg
            installer_glob: build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            target_ext: msi
            installer_glob: build/compose/binaries/main/msi/*.msi

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout ospchat-desktop
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Package native installer
        # GHP credentials are surfaced as Gradle properties so
        # settings.gradle.kts can authenticate the ospchat-shared registry
        # lookup.
        env:
          ORG_GRADLE_PROJECT_gprUser: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gprToken: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :packageDistributionForCurrentOS --no-daemon

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ospchat-${{ matrix.target_ext }}
          path: ${{ matrix.installer_glob }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Inspect downloaded artifacts
        run: ls -lR artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ospchat-deb/*.deb
            artifacts/ospchat-dmg/*.dmg
            artifacts/ospchat-msi/*.msi
          generate_release_notes: true
          fail_on_unmatched_files: true
