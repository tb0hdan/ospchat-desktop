name: Release

# On tag push (e.g. `v0.1.0`), matrix-build native installers on Linux,
# macOS, and Windows and attach all three to a GitHub Release named after
# the tag. jpackage only produces installers for its host OS, so the
# matrix is mandatory.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Required so the workflow's GITHUB_TOKEN can pull ospchat-shared from
  # GitHub Packages — even public packages require an authenticated GET.
  packages: read

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ospchat-deb
            installer_glob: build/compose/binaries/main/deb/*.deb
            gradle_extra: ''
          # macos-13 stays pinned to Intel hardware; setup-java installs the
          # x86_64 Temurin JDK which jpackage bundles into the runtime image.
          - os: macos-13
            artifact_name: ospchat-dmg-x86_64
            installer_glob: build/compose/binaries/main/dmg/*.dmg
            gradle_extra: '-PmacArch=x86_64'
          # macos-latest currently resolves to macos-14 (Apple Silicon);
          # setup-java installs the arm64 Temurin JDK -> arm64 .dmg.
          - os: macos-latest
            artifact_name: ospchat-dmg-arm64
            installer_glob: build/compose/binaries/main/dmg/*.dmg
            gradle_extra: '-PmacArch=arm64'
          - os: windows-latest
            artifact_name: ospchat-msi
            installer_glob: build/compose/binaries/main/msi/*.msi
            gradle_extra: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout ospchat-desktop
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        # Pinned to v5: gradle/actions@v6 relicensed the caching component
        # (`gradle-actions-caching`) as proprietary, and enabling caching on
        # v6 implicitly accepts https://gradle.com/legal/terms-of-use/.
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Package native installer
        # GHP credentials are surfaced as Gradle properties so
        # settings.gradle.kts can authenticate the ospchat-shared registry
        # lookup. matrix.gradle_extra carries `-PmacArch=...` on the macOS
        # entries so the produced .dmg filename embeds the architecture.
        env:
          ORG_GRADLE_PROJECT_gprUser: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gprToken: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :packageDistributionForCurrentOS ${{ matrix.gradle_extra }} --no-daemon

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.installer_glob }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Inspect downloaded artifacts
        run: ls -lR artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/ospchat-deb/*.deb
            artifacts/ospchat-dmg-x86_64/*.dmg
            artifacts/ospchat-dmg-arm64/*.dmg
            artifacts/ospchat-msi/*.msi
          generate_release_notes: true
          fail_on_unmatched_files: true
